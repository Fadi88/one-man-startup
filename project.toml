# The one file that makes this template yours. The setup agent fills it in
# during its interview; every other agent reads it and never edits it, except that the first
# developer fills [stack] test_command and build_command, and tools/template_update.py records
# [template] commit.
# "unset" means setup has not asked yet. Agents stop and ask rather than guess.

[owner]
name = "unset"
email = "unset"
# non-technical | basics | technical. Sets how every agent words its questions,
# approvals and reports (skills/founder-voice/). Setup asks; the founder can change it.
level = "non-technical"

[product]
name = "unset"
one_liner = "unset"
# Free text, e.g. "fintech", "health and fitness", "B2B devtools".
domain = "unset"
# ISO country codes where the product is sold or its users live, e.g. ["AE", "SA"].
regions = []
# Who uses it, in a sentence.
audience = "unset"
# consumers | small-business | mid-market | enterprise
customer_size = "unset"
# idea | prototype | beta | live
stage = "idea"
# new | rebuild | own. "rebuild" is a generic version of someone else's app; based_on names it and
# its public site, and a legal check is added. "own" starts from the founder's own existing app;
# based_on is its folder or repository, and setup asks whether to copy, rebuild or borrow from it.
origin = "unset"
based_on = ""
# proprietary, or an SPDX id such as "MIT" or "AGPL-3.0-only". Setup explains the options
# (skills/setup/licences.md); the founder decides.
licence = "unset"
# Personal data, payments, health data, children, AI decisions about people.
# Each one switches on extra legal and QA gates.
sensitive = []

[stack]
# Chosen by setup with the founder. Dev agents read these and never assume.
platform = "unset"
frontend = "unset"
backend = "unset"
database = "unset"
hosting = "unset"
# "none yet" until code exists; setup or the first developer agent fills them in.
test_command = "unset"
build_command = "unset"
# Folders holding the product's tests, e.g. ["tests", "src/__tests__"]. A test names the row it
# asserts (AUTH-12 in its name or a comment); tools/checks/req_check.py reads these folders to
# find the test behind every T row. Setup fills it once code exists.
test_paths = []

[team]
# Agents switched on for this project. Setup trims the list to the size of the
# company; the orchestrator never routes to an agent that is not here.
enabled = ["orchestrator", "setup", "researcher", "feasibility", "architect", "agentic-workflow",
           "product-designer", "web-dev", "android-dev", "ios-dev", "desktop-dev", "backend-dev", "debugger",
           "reviewer", "qa", "rollback", "security", "legal", "dashboard", "devops", "growth",
           "social-media", "optimizer"]

[gates]
# strict | standard | light, defined in skills/gates/SKILL.md. The template recommends strict and setup
# argues for it; the founder decides and the reason is recorded in
# docs/requirements/p1-closed-decisions.md.
level = "strict"

[style]
# Characters refused in docs, code comments and commit messages. Keep them as backslash-u
# escapes; the style check skips this one line in case a tool writes them out literally.
banned_chars = ["\u2014", "\u2013"]

[budget]
# What the founder spends each month, in USD, on the AI tools that build the product (their
# Claude, ChatGPT or Cursor plans and any API use by the agents), which the optimizer reports
# against. Not the cost of AI inside the product: that is measured per feature by feasibility
# and capped by the free-tier rows when there is a free tier. 0 = no ceiling set.
monthly_usd = 0

[publish]
# Whether any workflow in .github/workflows may publish or deploy (a website, an app, a release).
# The template's own landing page needs true; setup's clean-out sets a new project to false, and
# setup sets it back to true only when the founder asks to publish. The checks enforce it.
enabled = true

[tools]
# Which AI coding tools get generated adapters (tools/sync_adapters.py).
targets = ["claude", "codex", "gemini", "cursor"]
