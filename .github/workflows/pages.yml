name: pages

# Publishes site/ as the template's landing page. The diagrams are copied from
# docs/images at build time, so they live in one place.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A copy made from the template has no Pages site until setup removes this file, so its
    # first push would fail here (seen in tracker_app on 2026-10-17).
    if: github.repository == 'Fadi88/one-man-startup'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp site/index.html _site/
          cp docs/images/*.svg docs/images/*.png _site/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
