<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">From idea to launch</title>
  <desc id="d">Five steps, each a standard software practice: set up (product discovery), get grilled on each idea after a look at similar products (requirements first), the agents build it (test-driven development), they check it (code review, QA and security review), and you say go before anything goes live (release approval).</desc>
  <style>
    .bg1, .bg2 { stop-color: #ffffff; }
    .ink { fill: #111827; } .soft { fill: #4b5563; }
    .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; } .rule { stroke: #e5e7eb; stroke-width: 1.5; }
    .track { stroke: #d1d5db; stroke-width: 3; fill: none; stroke-linecap: round; } .head { fill: #d1d5db; }
    .num { fill: #ffffff; } .num5 { fill: #ffffff; } .label { fill: #6b7280; }
    .n1, .n2, .n3, .n4 { fill: #1d4ed8; } .n5 { fill: #111827; }
    .t1, .t2, .t3, .t4 { fill: #1d4ed8; } .t5 { fill: #111827; }
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg1, .bg2 { stop-color: #0d1117; }
      .ink { fill: #e6edf3; } .soft { fill: #9da7b3; }
      .card { fill: #0d1117; stroke: #30363d; stroke-width: 1; } .rule { stroke: #21262d; stroke-width: 1.5; }
      .track { stroke: #30363d; stroke-width: 3; fill: none; stroke-linecap: round; } .head { fill: #30363d; }
      .num { fill: #ffffff; } .num5 { fill: #0d1117; } .label { fill: #7d8590; }
      .n1, .n2, .n3, .n4 { fill: #2f6feb; } .n5 { fill: #e6edf3; }
      .t1, .t2, .t3, .t4 { fill: #79b0ff; } .t5 { fill: #e6edf3; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2433" flood-opacity="0.10"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <text class="ink" x="40" y="58" font-size="26" font-weight="700">From idea to launch</text>
  <text class="soft" x="40" y="84" font-size="15">Each step is a standard software practice, not a prompt and a hope.</text>

  <g font-size="15">
    <g transform="translate(40 112)">
      <rect class="card" width="204" height="232" rx="18"/>
      <circle class="n1" cx="38" cy="40" r="26" opacity="0.15"/><circle class="n1" cx="38" cy="40" r="18"/><text class="num" x="38" y="46" font-size="16" font-weight="700" text-anchor="middle">1</text>
      <text class="ink" x="20" y="96" font-size="19" font-weight="700">Set up</text>
      <text class="soft" x="20" y="122">Answer questions about</text><text class="soft" x="20" y="142">your business, country</text><text class="soft" x="20" y="162">and customers.</text>
      <path class="rule" d="M20 182 H184"/>
      <text class="label" x="20" y="202" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="t1" x="20" y="220" font-size="13" font-weight="700">Product discovery</text>
    </g>
    <g transform="translate(270 112)">
      <rect class="card" width="204" height="232" rx="18"/>
      <circle class="n2" cx="38" cy="40" r="26" opacity="0.15"/><circle class="n2" cx="38" cy="40" r="18"/><text class="num" x="38" y="46" font-size="16" font-weight="700" text-anchor="middle">2</text>
      <text class="ink" x="20" y="96" font-size="19" font-weight="700">Get grilled</text>
      <text class="soft" x="20" y="122">Each idea is compared</text><text class="soft" x="20" y="142">to rivals, then grilled</text><text class="soft" x="20" y="162">until it is clear.</text>
      <path class="rule" d="M20 182 H184"/>
      <text class="label" x="20" y="202" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="t2" x="20" y="220" font-size="13" font-weight="700">Requirements first</text>
    </g>
    <g transform="translate(500 112)">
      <rect class="card" width="204" height="232" rx="18"/>
      <circle class="n3" cx="38" cy="40" r="26" opacity="0.15"/><circle class="n3" cx="38" cy="40" r="18"/><text class="num" x="38" y="46" font-size="16" font-weight="700" text-anchor="middle">3</text>
      <text class="ink" x="20" y="96" font-size="19" font-weight="700">Build</text>
      <text class="soft" x="20" y="122">Agents design and write</text><text class="soft" x="20" y="142">the app, each test</text><text class="soft" x="20" y="162">before its code.</text>
      <path class="rule" d="M20 182 H184"/>
      <text class="label" x="20" y="202" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="t3" x="20" y="220" font-size="13" font-weight="700">Test-driven development</text>
    </g>
    <g transform="translate(730 112)">
      <rect class="card" width="204" height="232" rx="18"/>
      <circle class="n4" cx="38" cy="40" r="26" opacity="0.15"/><circle class="n4" cx="38" cy="40" r="18"/><text class="num" x="38" y="46" font-size="16" font-weight="700" text-anchor="middle">4</text>
      <text class="ink" x="20" y="96" font-size="19" font-weight="700">Check</text>
      <text class="soft" x="20" y="122">Code review, testing,</text><text class="soft" x="20" y="142">security and a legal</text><text class="soft" x="20" y="162">checklist per country.</text>
      <path class="rule" d="M20 182 H184"/>
      <text class="label" x="20" y="202" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="t4" x="20" y="220" font-size="13" font-weight="700">Code review and QA</text>
    </g>
    <g transform="translate(960 112)">
      <rect class="card" width="204" height="232" rx="18"/>
      <circle class="n5" cx="38" cy="40" r="26" opacity="0.15"/><circle class="n5" cx="38" cy="40" r="18"/><text class="num num5" x="38" y="46" font-size="16" font-weight="700" text-anchor="middle">5</text>
      <text class="ink" x="20" y="96" font-size="19" font-weight="700">You say go</text>
      <text class="soft" x="20" y="122">Nothing goes live, gets</text><text class="soft" x="20" y="142">paid for or deleted until</text><text class="soft" x="20" y="162">you approve it.</text>
      <path class="rule" d="M20 182 H184"/>
      <text class="label" x="20" y="202" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="t5" x="20" y="220" font-size="13" font-weight="700">Release approval</text>
    </g>
  </g>
  <g class="track" marker-end="url(#a)">
    <path d="M247 152 L266 152"/><path d="M477 152 L496 152"/><path d="M707 152 L726 152"/><path d="M937 152 L956 152"/>
  </g>
</svg>
