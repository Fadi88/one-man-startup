<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">From idea to launch</title>
  <desc id="d">Five steps, each a standard software practice: set up (product discovery), get grilled on each idea after a look at similar products (requirements first), the agents build it (test-driven development), they check it (code review, QA and security review), and you say go before anything goes live (release approval).</desc>
  <style>
    .bg { fill: #ffffff; stroke: #e4e0eb; stroke-width: 1.5; }
    .card { fill: #f7f5fa; } .final { fill: #d6246e; }
    .ink { fill: #14121f; } .soft { fill: #55505f; } .rule { stroke: #e4e0eb; stroke-width: 1.5; }
    .num { fill: #d6246e; } .label { fill: #55505f; } .prac { fill: #b0124f; }
    .onbrand { fill: #ffffff; } .rulebrand { stroke: #ffffff; stroke-opacity: 0.45; stroke-width: 1.5; }
    .chev { stroke: #d6246e; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f0d14; stroke: #2c2837; }
      .card { fill: #1a1722; } .ink { fill: #f4f2f8; } .soft { fill: #b5afc2; } .rule { stroke: #2c2837; }
      .num { fill: #ff6fa6; } .label { fill: #b5afc2; } .prac { fill: #ff6fa6; }
      .chev { stroke: #ff6fa6; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="1198" height="378" rx="28"/>
  <text class="ink" x="40" y="62" font-size="28" font-weight="800" letter-spacing="-0.5">From idea to launch</text>
  <text class="soft" x="40" y="90" font-size="15">Each step is a standard software practice, not a prompt and a hope.</text>

  <g font-size="14">
    <g transform="translate(40 116)">
      <rect class="card" width="212" height="232" rx="24"/>
      <text class="num" x="20" y="58" font-size="44" font-weight="800">1</text>
      <text class="ink" x="20" y="94" font-size="19" font-weight="800">Set up</text>
      <text class="soft" x="20" y="120">Answer questions about</text><text class="soft" x="20" y="140">your business, country</text><text class="soft" x="20" y="160">and customers.</text>
      <path class="rule" d="M20 182 H192"/>
      <text class="label" x="20" y="201" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="prac" x="20" y="220" font-size="13" font-weight="700">Product discovery</text>
    </g>
    <g transform="translate(267 116)">
      <rect class="card" width="212" height="232" rx="24"/>
      <text class="num" x="20" y="58" font-size="44" font-weight="800">2</text>
      <text class="ink" x="20" y="94" font-size="19" font-weight="800">Get grilled</text>
      <text class="soft" x="20" y="120">Each idea is compared</text><text class="soft" x="20" y="140">to rivals, then grilled</text><text class="soft" x="20" y="160">until it is clear.</text>
      <path class="rule" d="M20 182 H192"/>
      <text class="label" x="20" y="201" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="prac" x="20" y="220" font-size="13" font-weight="700">Requirements first</text>
    </g>
    <g transform="translate(494 116)">
      <rect class="card" width="212" height="232" rx="24"/>
      <text class="num" x="20" y="58" font-size="44" font-weight="800">3</text>
      <text class="ink" x="20" y="94" font-size="19" font-weight="800">Build</text>
      <text class="soft" x="20" y="120">Agents design and write</text><text class="soft" x="20" y="140">the app, each test</text><text class="soft" x="20" y="160">before its code.</text>
      <path class="rule" d="M20 182 H192"/>
      <text class="label" x="20" y="201" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="prac" x="20" y="220" font-size="13" font-weight="700">Test-driven development</text>
    </g>
    <g transform="translate(721 116)">
      <rect class="card" width="212" height="232" rx="24"/>
      <text class="num" x="20" y="58" font-size="44" font-weight="800">4</text>
      <text class="ink" x="20" y="94" font-size="19" font-weight="800">Check</text>
      <text class="soft" x="20" y="120">Code review, testing,</text><text class="soft" x="20" y="140">security and a legal</text><text class="soft" x="20" y="160">checklist per country.</text>
      <path class="rule" d="M20 182 H192"/>
      <text class="label" x="20" y="201" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="prac" x="20" y="220" font-size="13" font-weight="700">Code review and QA</text>
    </g>
    <g transform="translate(948 116)">
      <rect class="final" width="212" height="232" rx="24"/>
      <text class="onbrand" x="20" y="58" font-size="44" font-weight="800">5</text>
      <text class="onbrand" x="20" y="94" font-size="19" font-weight="800">You say go</text>
      <text class="onbrand" x="20" y="120">Nothing goes live, gets</text><text class="onbrand" x="20" y="140">paid for or deleted until</text><text class="onbrand" x="20" y="160">you approve it.</text>
      <path class="rulebrand" d="M20 182 H192"/>
      <text class="onbrand" x="20" y="201" font-size="11" font-weight="700" letter-spacing="1.2">PRACTICE</text>
      <text class="onbrand" x="20" y="220" font-size="13" font-weight="700">Release approval</text>
    </g>
  </g>
  <g class="chev">
    <path d="M256 232 L262 238 L256 244"/><path d="M483 232 L489 238 L483 244"/><path d="M710 232 L716 238 L710 244"/><path d="M937 232 L943 238 L937 244"/>
  </g>
</svg>
