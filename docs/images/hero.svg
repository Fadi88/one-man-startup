<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">One-man startup</title>
  <desc id="d">Build a software startup without writing code. Not vibe coding: a proven team workflow in which you sit in the middle and decide, and AI agents plan, build, test, check the law, launch and grow your product.</desc>
  <style>
    .bg1, .bg2 { stop-color: #ffffff; }
    .ink { fill: #111827; } .soft { fill: #4b5563; }
    .you1, .you2 { stop-color: #111827; } .youtxt { fill: #ffffff; }
    .glowA, .glowB { stop-color: #ffffff; stop-opacity: 0; } .dot { fill: #e5e7eb; }
    .ring { stroke: #d1d5db; stroke-width: 1.5; fill: none; stroke-dasharray: 3 7; }
    .ring2 { stroke: #e5e7eb; stroke-width: 1.5; fill: none; } .spoke { stroke: #e5e7eb; stroke-width: 1.5; }
    .halo { fill: #1d4ed8; opacity: 0.08; }
    .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .badge { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; } .badgetxt { fill: #1d4ed8; }
    .tag { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; } .tagtxt { fill: #111827; }
    .c1, .c2, .c3, .c4, .c5, .c6 { fill: #1d4ed8; }
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg1, .bg2 { stop-color: #0d1117; }
      .ink { fill: #e6edf3; } .soft { fill: #9da7b3; }
      .you1, .you2 { stop-color: #e6edf3; } .youtxt { fill: #0d1117; }
      .glowA, .glowB { stop-opacity: 0; } .dot { fill: #21262d; }
      .ring { stroke: #30363d; stroke-width: 1.5; fill: none; stroke-dasharray: 3 7; }
      .ring2 { stroke: #21262d; stroke-width: 1.5; fill: none; } .spoke { stroke: #21262d; stroke-width: 1.5; }
      .halo { fill: #2f6feb; opacity: 0.08; }
      .chip { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .badge { fill: #121d33; stroke: #2f6feb; stroke-width: 1.5; } .badgetxt { fill: #79b0ff; }
      .tag { fill: #0d1117; stroke: #30363d; stroke-width: 1; } .tagtxt { fill: #e6edf3; }
      .c1, .c2, .c3, .c4, .c5, .c6 { fill: #2f6feb; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient>
    <radialGradient id="gA"><stop offset="0" class="glowA" stop-opacity="0.22"/><stop offset="1" class="glowA" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" class="glowB" stop-opacity="0.18"/><stop offset="1" class="glowB" stop-opacity="0"/></radialGradient>
    <linearGradient id="you" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="you1"/><stop offset="1" class="you2"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle class="dot" cx="2" cy="2" r="1.6"/></pattern>
    <filter id="sh" x="-30%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d2433" flood-opacity="0.13"/></filter>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <circle cx="1080" cy="40" r="300" fill="url(#gA)"/>
    <circle cx="720" cy="440" r="260" fill="url(#gB)"/>
    <rect x="700" y="0" width="500" height="440" fill="url(#dots)" opacity="0.6"/>
  </g>

  <g transform="translate(64 74)">
    <rect class="badge" width="190" height="34" rx="17"/>
    <circle class="c1" cx="20" cy="17" r="5"/>
    <text class="badgetxt" x="34" y="22" font-size="14" font-weight="700" letter-spacing="1.5">NOT VIBE CODING</text>
  </g>
  <text class="ink" x="62" y="168" font-size="58" font-weight="800" letter-spacing="-1">One-man startup</text>
  <text class="ink" x="64" y="216" font-size="25" font-weight="600">Build a software startup without writing code.</text>
  <text class="soft" x="64" y="252" font-size="20">A proven team workflow, run by AI agents.</text>
  <text class="soft" x="64" y="280" font-size="20">You make the decisions.</text>

  <g font-size="14" font-weight="600">
    <g transform="translate(64 314)"><rect class="tag" width="168" height="32" rx="16"/><circle class="c3" cx="18" cy="16" r="4.5"/><text class="tagtxt" x="30" y="21">Requirements first</text></g>
    <g transform="translate(242 314)"><rect class="tag" width="122" height="32" rx="16"/><circle class="c2" cx="18" cy="16" r="4.5"/><text class="tagtxt" x="30" y="21">Test-driven</text></g>
    <g transform="translate(374 314)"><rect class="tag" width="194" height="32" rx="16"/><circle class="c1" cx="18" cy="16" r="4.5"/><text class="tagtxt" x="30" y="21">Reviewed and approved</text></g>
  </g>
  <text class="soft" x="64" y="392" font-size="15">Made for Claude Code, Codex, Gemini CLI and Cursor</text>

  <g transform="translate(925 220)">
    <circle class="ring2" r="95"/>
    <circle class="ring" r="150"/>
    <path class="spoke" d="M0 -60 L0 -126 M52 -30 L109 -63 M52 30 L109 63 M0 60 L0 126 M-52 30 L-109 63 M-52 -30 L-109 -63"/>
    <circle class="halo" r="78"/>
    <circle r="58" fill="url(#you)"/>
    <text class="youtxt" y="9" font-size="26" font-weight="700" text-anchor="middle">You</text>

    <g font-size="17" font-weight="600">
      <g transform="translate(0 -150)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="c1" cx="-50" r="10"/><text class="ink" x="-32" y="6">Plan</text></g>
      <g transform="translate(130 -75)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="c2" cx="-50" r="10"/><text class="ink" x="-32" y="6">Build</text></g>
      <g transform="translate(130 75)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="c3" cx="-50" r="10"/><text class="ink" x="-32" y="6">Test</text></g>
      <g transform="translate(0 150)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="c4" cx="-50" r="10"/><text class="ink" x="-32" y="6">Legal check</text></g>
      <g transform="translate(-130 75)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="c5" cx="-50" r="10"/><text class="ink" x="-32" y="6">Launch</text></g>
      <g transform="translate(-130 -75)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="c6" cx="-50" r="10"/><text class="ink" x="-32" y="6">Grow</text></g>
    </g>
  </g>
</svg>
