<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">One-man startup</title>
  <desc id="d">Build a software startup without writing code. Not vibe coding: a proven team workflow in which you sit in the middle and decide, and AI agents plan, build, test, check the law, launch and grow your product.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #e4e0eb; stroke-width: 1.5; }
    .ink { fill: #14121f; } .soft { fill: #55505f; } .eyebrow { fill: #b0124f; }
    .brand { fill: #d6246e; } .onbrand { fill: #ffffff; }
    .wash { fill: #fdebf3; }
    .spoke { stroke: #f3b5d0; stroke-width: 2; stroke-linecap: round; }
    .chip { fill: #ffffff; stroke: #e4e0eb; stroke-width: 1.5; }
    .tag { fill: #f7f5fa; } .tagtxt { fill: #14121f; }
    text { font-family: -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f0d14; stroke: #2c2837; }
      .ink { fill: #f4f2f8; } .soft { fill: #b5afc2; } .eyebrow { fill: #ff6fa6; }
      .wash { fill: #2a1420; } .spoke { stroke: #5a2a42; }
      .chip { fill: #1a1722; stroke: #2c2837; }
      .tag { fill: #1a1722; } .tagtxt { fill: #f4f2f8; }
    }
  </style>
  <clipPath id="frame"><rect x="1" y="1" width="1198" height="438" rx="28"/></clipPath>
  <rect class="bg" x="1" y="1" width="1198" height="438" rx="28"/>
  <g clip-path="url(#frame)"><circle class="wash" cx="925" cy="220" r="205"/></g>

  <text class="eyebrow" x="64" y="92" font-size="14" font-weight="800" letter-spacing="2.4">NOT VIBE CODING</text>
  <text class="ink" x="62" y="168" font-size="58" font-weight="800" letter-spacing="-1.5">One-man startup</text>
  <text class="ink" x="64" y="216" font-size="25" font-weight="600">Build a software startup without writing code.</text>
  <text class="soft" x="64" y="252" font-size="20">A proven team workflow, run by AI agents.</text>
  <text class="soft" x="64" y="280" font-size="20">You make the decisions.</text>

  <g font-size="14" font-weight="600">
    <g transform="translate(64 314)"><rect class="tag" width="168" height="34" rx="17"/><circle class="brand" cx="18" cy="17" r="4.5"/><text class="tagtxt" x="30" y="22">Requirements first</text></g>
    <g transform="translate(242 314)"><rect class="tag" width="122" height="34" rx="17"/><circle class="brand" cx="18" cy="17" r="4.5"/><text class="tagtxt" x="30" y="22">Test-driven</text></g>
    <g transform="translate(374 314)"><rect class="tag" width="194" height="34" rx="17"/><circle class="brand" cx="18" cy="17" r="4.5"/><text class="tagtxt" x="30" y="22">Reviewed and approved</text></g>
  </g>
  <text class="soft" x="64" y="392" font-size="15">Made for Claude Code, Codex, Gemini CLI and Cursor</text>

  <g transform="translate(925 220)">
    <path class="spoke" d="M0 -60 L0 -126 M52 -30 L109 -63 M52 30 L109 63 M0 60 L0 126 M-52 30 L-109 63 M-52 -30 L-109 -63"/>
    <circle class="brand" r="58"/>
    <text class="onbrand" y="9" font-size="26" font-weight="800" text-anchor="middle">You</text>

    <g font-size="17" font-weight="600">
      <g transform="translate(0 -150)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="brand" cx="-50" r="6"/><text class="ink" x="-34" y="6">Plan</text></g>
      <g transform="translate(130 -75)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="brand" cx="-50" r="6"/><text class="ink" x="-34" y="6">Build</text></g>
      <g transform="translate(130 75)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="brand" cx="-50" r="6"/><text class="ink" x="-34" y="6">Test</text></g>
      <g transform="translate(0 150)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="brand" cx="-50" r="6"/><text class="ink" x="-34" y="6">Legal check</text></g>
      <g transform="translate(-130 75)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="brand" cx="-50" r="6"/><text class="ink" x="-34" y="6">Launch</text></g>
      <g transform="translate(-130 -75)"><rect class="chip" x="-74" y="-24" width="148" height="48" rx="24"/><circle class="brand" cx="-50" r="6"/><text class="ink" x="-34" y="6">Grow</text></g>
    </g>
  </g>
</svg>
