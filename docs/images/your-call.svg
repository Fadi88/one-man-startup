<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">What the agents do alone and what waits for you</title>
  <desc id="d">Agents can read, research, draft, write code and run tests on their own. Going live, spending money, deleting anything, sending messages, changing prices or accepting a legal risk always waits for your approval.</desc>
  <style>
    .bg1, .bg2 { stop-color: #ffffff; }
    .ink { fill: #111827; } .soft { fill: #4b5563; }
    .ok { fill: #f6f7f9; stroke: #d1d5db; stroke-width: 1; } .wait { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; }
    .okc, .okbar { fill: #6b7280; } .waitc, .waitbar { fill: #1d4ed8; }
    .glyph { stroke: #ffffff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg1, .bg2 { stop-color: #0d1117; }
      .ink { fill: #e6edf3; } .soft { fill: #9da7b3; }
      .ok { fill: #161b22; stroke: #30363d; stroke-width: 1; } .wait { fill: #121d33; stroke: #1f3a6e; stroke-width: 1; }
      .okc, .okbar { fill: #7d8590; } .waitc, .waitbar { fill: #2f6feb; }
      .glyph { stroke: #ffffff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2433" flood-opacity="0.08"/></filter>
    <clipPath id="c"><rect width="532" height="240" rx="18"/></clipPath>
    <g id="tick"><circle class="okc" r="12"/><path class="glyph" d="M-5 0 L-1.5 3.5 L5.5 -4"/></g>
    <g id="hold"><circle class="waitc" r="12"/><rect x="-5" y="-1" width="10" height="7" rx="1.5" fill="#ffffff"/><path class="glyph" d="M-3 -1 V-3.5 a3 3 0 0 1 6 0 V-1"/></g>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <g transform="translate(48 40)">
    <rect class="ok" width="532" height="240" rx="18"/>
    <g clip-path="url(#c)"><rect class="okbar" width="6" height="240"/></g>
    <text class="ink" x="32" y="50" font-size="21" font-weight="700">Agents do this on their own</text>
    <g font-size="17">
      <use href="#tick" x="44" y="94"/><text class="soft" x="68" y="100">Read, research and ask you questions</text>
      <use href="#tick" x="44" y="134"/><text class="soft" x="68" y="140">Write plans, designs and drafts</text>
      <use href="#tick" x="44" y="174"/><text class="soft" x="68" y="180">Write code and test it</text>
      <use href="#tick" x="44" y="214"/><text class="soft" x="68" y="220">Suggest how to save money</text>
    </g>
  </g>
  <g transform="translate(620 40)">
    <rect class="wait" width="532" height="240" rx="18"/>
    <g clip-path="url(#c)"><rect class="waitbar" width="6" height="240"/></g>
    <text class="ink" x="32" y="50" font-size="21" font-weight="700">Always waits for your yes</text>
    <g font-size="17">
      <use href="#hold" x="44" y="94"/><text class="soft" x="68" y="100">Going live, or changing anything that is live</text>
      <use href="#hold" x="44" y="134"/><text class="soft" x="68" y="140">Spending money, sending messages</text>
      <use href="#hold" x="44" y="174"/><text class="soft" x="68" y="180">Deleting anything, touching real customer data</text>
      <use href="#hold" x="44" y="214"/><text class="soft" x="68" y="220">Prices, targets and accepting a legal risk</text>
    </g>
  </g>
</svg>
